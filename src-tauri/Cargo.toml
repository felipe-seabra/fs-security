[package]
name = "fs-security"
version = "0.1.0"
description = "Local-first security auditing and system optimization"
authors = ["FS Security contributors"]
edition = "2021"

[lib]
name = "fs_security_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tauri = { version = "2", features = [] }